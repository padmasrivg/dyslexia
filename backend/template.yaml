AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Dyslexia Vision Assistant backend - API Gateway -> Lambda -> Bedrock + Polly

Parameters:
  BedrockModelId:
    Type: String
    Description: >-
      Bedrock model id or inference profile id the function calls (no default on purpose;
      models are retired over time). Find a currently available one in your region with
      `aws bedrock list-foundation-models --region REGION --by-provider anthropic` or
      `aws bedrock list-inference-profiles --region REGION`. Some models can only be called
      through an inference profile id (for example one that starts with "us." or "eu.").
      Model access must also be enabled in the Bedrock console.
  BedrockModelArns:
    Type: CommaDelimitedList
    Description: >-
      Exact ARNs the function may invoke, comma separated, no wildcard. If BedrockModelId is a
      foundation model id use
      arn:aws:bedrock:REGION::foundation-model/MODEL_ID . If it is an inference profile, list BOTH
      the profile ARN (arn:aws:bedrock:REGION:ACCOUNT_ID:inference-profile/PROFILE_ID) AND the
      foundation-model ARN of every region the profile can route to (shown by
      `aws bedrock get-inference-profile --inference-profile-identifier PROFILE_ID`, field "models").
  PollyVoiceId:
    Type: String
    Default: Joanna
    Description: Polly voice id. Check support with `aws polly describe-voices --engine neural --language-code en-US`.
  PollyEngine:
    Type: String
    Default: neural
    AllowedValues: [neural, standard, long-form, generative]
    Description: Preferred Polly engine. The function retries once with the standard engine if this one is unsupported.
  AllowedOrigin:
    Type: String
    Default: "http://localhost:8765"
    Description: >-
      Origin allowed by CORS. The native local agent does not need CORS; only change this if a
      browser page calls the API directly. Avoid "*".
  LogRetentionDays:
    Type: Number
    Default: 14
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]
    Description: CloudWatch Logs retention for the function logs.
  ThrottleRateLimit:
    Type: Number
    Default: 5
    Description: Steady-state requests per second allowed by the usage plan (also caps Bedrock cost).
  ThrottleBurstLimit:
    Type: Number
    Default: 10
    Description: Burst requests allowed by the usage plan.

Resources:
  AssistLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-assist"
      RetentionInDays: !Ref LogRetentionDays

  AssistFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: assist-least-privilege
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Only its own log group (the group is created above, so no CreateLogGroup is needed).
              - Sid: WriteOwnLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub "${AssistLogGroup.Arn}:*"
              # Only the exact model / inference-profile ARNs passed in. The Converse API is
              # authorised by bedrock:InvokeModel.
              - Sid: InvokeAllowedModelsOnly
                Effect: Allow
                Action: bedrock:InvokeModel
                Resource: !Ref BedrockModelArns
              # Polly does not support resource-level restriction for SynthesizeSpeech, so the
              # resource must be "*". The action itself is the only Polly permission granted.
              - Sid: SynthesizeSpeech
                Effect: Allow
                Action: polly:SynthesizeSpeech
                Resource: "*"

  AssistFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: lambda_handler.lambda_handler
      CodeUri: .
      Runtime: python3.13
      Architectures: [arm64]
      MemorySize: 256
      Timeout: 25
      Role: !GetAtt AssistFunctionRole.Arn
      LoggingConfig:
        LogGroup: !Ref AssistLogGroup
      Environment:
        Variables:
          BEDROCK_MODEL_ID: !Ref BedrockModelId
          POLLY_VOICE_ID: !Ref PollyVoiceId
          POLLY_ENGINE: !Ref PollyEngine
          POLLY_FALLBACK_ENGINE: standard
          ALLOWED_ORIGIN: !Ref AllowedOrigin
      Events:
        Assist:
          Type: Api
          Properties:
            RestApiId: !Ref AssistApi
            Path: /assist
            Method: POST
            Auth:
              ApiKeyRequired: true
            RequestModel:
              Model: AssistRequest
              Required: true
              ValidateBody: true

  # Access logging for API Gateway is intentionally NOT configured: it requires an
  # account-level CloudWatch Logs role (AWS::ApiGateway::Account) which is shared by every API
  # in the account and region, so a single stack should not own it. Lambda logs and API Gateway
  # method metrics (below) are enabled instead.
  AssistApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: prod
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          MetricsEnabled: true
          ThrottlingRateLimit: !Ref ThrottleRateLimit
          ThrottlingBurstLimit: !Ref ThrottleBurstLimit
      Cors:
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type,x-api-key'"
        AllowOrigin: !Sub "'${AllowedOrigin}'"
      Auth:
        ApiKeyRequired: true
        UsagePlan:
          CreateUsagePlan: PER_API
          UsagePlanName: !Sub "${AWS::StackName}-plan"
          Throttle:
            RateLimit: !Ref ThrottleRateLimit
            BurstLimit: !Ref ThrottleBurstLimit
      Models:
        AssistRequest:
          $schema: "http://json-schema.org/draft-04/schema#"
          title: AssistRequest
          type: object
          required: [word, context]
          additionalProperties: false
          properties:
            word:
              type: string
              minLength: 1
              maxLength: 64
            context:
              type: string
              minLength: 1
              maxLength: 600

  # Lambda "Errors" only counts unhandled exceptions; the handler converts failures into HTTP
  # error responses, so API Gateway 5XX is alarmed as well.
  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The assist API returned 5XX responses.
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Sub "${AWS::StackName}-api"
        - Name: Stage
          Value: prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

  LambdaErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The assist Lambda function reported errors.
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref AssistFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching

Outputs:
  AssistUrl:
    Description: Invoke URL for POST /assist (set this as ASSIST_API_URL for the local agent)
    Value: !Sub "https://${AssistApi}.execute-api.${AWS::Region}.amazonaws.com/prod/assist"
  ApiKeyId:
    Description: >-
      API key id (not the secret). Read the key value with
      `aws apigateway get-api-key --api-key <id> --include-value --query value --output text`
      and set it as ASSIST_API_KEY for the local agent.
    Value: !Ref AssistApiApiKey
